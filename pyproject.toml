[project]
name = "blurfield-backend"
version = "0.2.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
